<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>We’re Refining the Experience</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --x:50%;
  --y:50%;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:#0e0f12;
  color:#f5f5f7;
}

/* REFINED GRADIENT — SMALLER RADIUS */
.gradient{
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      clamp(260px,32vw,420px) at var(--x) var(--y),
      rgba(140,190,255,0.75),
      rgba(90,130,255,0.38),
      rgba(50,70,140,0.16),
      transparent 65%
    ),
    radial-gradient(
      clamp(420px,55vw,680px) at 20% 80%,
      rgba(170,120,255,0.18),
      transparent 70%
    );
  will-change:background;
  pointer-events:none;
}

/* VIGNETTE */
.gradient::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(
    circle at center,
    transparent 50%,
    rgba(0,0,0,0.6) 88%
  );
}

/* CONTENT */
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card{
  padding:clamp(36px,6vw,64px) clamp(40px,7vw,84px);
  border-radius:28px;
  background:rgba(20,22,28,0.55);
  backdrop-filter:blur(22px);
  box-shadow:
    0 30px 90px rgba(0,0,0,0.65),
    inset 0 1px 0 rgba(255,255,255,0.06);
  text-align:center;
  max-width:520px;
  width:100%;
}

.card h1{
  font-size:clamp(1.6rem,4vw,2.35rem);
  font-weight:600;
  letter-spacing:-0.02em;
}

.card p{
  margin-top:14px;
  font-size:clamp(0.9rem,2.5vw,1rem);
  color:#aeb2c0;
}

/* LOADER */
.loader{
  margin:28px auto 0;
  width:120px;
  height:2px;
  background:rgba(255,255,255,0.18);
  overflow:hidden;
}

.loader::after{
  content:"";
  display:block;
  width:40px;
  height:100%;
  background:linear-gradient(90deg,#7ab8ff,#caa6ff);
  animation:slide 1.6s infinite ease-in-out;
}

@keyframes slide{
  from{transform:translateX(-50px)}
  to{transform:translateX(170px)}
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
  font-size:0.75rem;
  color:#7b8092;
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce){
  .loader::after{animation:none}
}
</style>
</head>

<body>

<div class="gradient" id="gradient"></div>

<div class="overlay">
  <div class="card">
    <h1>We’re refining the site</h1>
    <p>Designing a calmer, more powerful experience.</p>
    <div class="loader"></div>
  </div>
</div>

<div class="footer">Designed with intention.</div>

<script>
const root = document.documentElement;

let targetX = 50, targetY = 50;
let currentX = 50, currentY = 50;

let isTouching = false;

/* UPDATE TARGET */
function updateTarget(x, y) {
  targetX = (x / window.innerWidth) * 100;
  targetY = (y / window.innerHeight) * 100;
}

/* DESKTOP */
window.addEventListener("mousemove", e => {
  if (!isTouching) updateTarget(e.clientX, e.clientY);
}, { passive: true });

/* MOBILE / TABLET */
window.addEventListener("touchstart", e => {
  isTouching = true;
  const t = e.touches[0];
  updateTarget(t.clientX, t.clientY);
}, { passive: true });

window.addEventListener("touchmove", e => {
  if (!isTouching) return;
  const t = e.touches[0];
  updateTarget(t.clientX, t.clientY);
}, { passive: true });

window.addEventListener("touchend", () => {
  isTouching = false;
}, { passive: true });

/* APPLE-STYLE INERTIA LOOP */
function animate() {
  currentX += (targetX - currentX) * 0.08;
  currentY += (targetY - currentY) * 0.08;

  root.style.setProperty('--x', currentX.toFixed(2) + '%');
  root.style.setProperty('--y', currentY.toFixed(2) + '%');

  requestAnimationFrame(animate);
}
animate();
</script>


</body>
</html>
